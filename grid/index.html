<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Laboratorio Grid con Inspector</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h2>Posicionamiento con CSS Grid (Usa el Inspector del Navegador)</h2>
  <p>Cambia la clase 'pos-1' por las demás en el HTML para mover el hijo.</p>

  <!-- Contenedor 4x4 sin trucos visuales en el HTML -->
  <!-- 💡 INTERCAMBIA AQUÍ: pos-1, pos-2, pos-3 -->
  <!-- El contenedor solo crea la malla de 4x4 -->
<div class="grid-contenedor">
  <!-- 💡 INTERCAMBIA LA CLASE DE POSICIÓN AQUÍ DIRECTAMENTE EN EL HIJO: pos-1, pos-2 o pos-3 -->
  <div class="hijo-viajero pos-3">Hijo</div>
</div>

</body>
</html>
